name: windows-cuda

on:
  workflow_call:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Host C++ is compiled with clang (GNU-style driver, MSVC ABI), same as
      # the Vulkan build: the codebase's CPU kernels use clang/GCC target
      # pragmas that MSVC cannot honor. nvcc still uses MSVC as its host
      # compiler (the only one nvcc supports on Windows); only the .cu
      # translation units go through it.
      - name: Install LLVM 22.1.0
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm-22.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\llvm-22.exe" -ArgumentList "/S" -Wait
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: 'network'

      - name: Configure and build (CUDA only, clang host + nvcc/MSVC device)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -DevCmdArguments '-arch=x64' -SkipAutomaticLocation
          # DevShell puts VS's bundled Clang 19 first in PATH; prefer the LLVM 22
          # install (same toolchain as the Vulkan build).
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          # Forward slashes: CMake's CUDA compiler-id step mangles backslashes
          # in the -ccbin path it builds for nvcc.
          $cl = (Get-Command cl.exe).Source.Replace('\', '/')
          Write-Host "nvcc host compiler: $cl"
          clang --version
          nvcc --version
          cmake -S . -B build -G Ninja `
            -DQE_CUDA=ON -DQE_VULKAN=OFF `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            "-DCMAKE_CUDA_ARCHITECTURES=80-real;86-real;89-real;90-real;100-real;120" `
            "-DCMAKE_CUDA_FLAGS=--threads=2" `
            -DCMAKE_CUDA_HOST_COMPILER="$cl" `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel --target qwen35-server qwen35-engine qe_test_cpu qe_ink_spec_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Backend cuda -BuildDirectory build -OutputDirectory dist

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: qwen-hyperdrive-windows-cuda-x64
          path: dist/qwen-hyperdrive-windows-cuda-x64.zip
          compression-level: 0
          if-no-files-found: error
