name: windows-vulkan

on:
  push:
    branches: [windows-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check clang (LLVM, GNU-style driver targeting the MSVC ABI)
        shell: pwsh
        run: |
          clang --version
          clang++ --version
          ninja --version
          cmake --version

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: true
          cache: true
          stripdown: true

      - name: Configure (Vulkan only, clang)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DQE_CUDA=OFF -DQE_VULKAN=ON `
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: qwen-hyperdrive-windows-vulkan
          path: |
            build/qwen35-server-vk.exe
            build/qwen35-engine-vk.exe
            build/qe_vk_test.exe
            build/qe_test_cpu.exe
          if-no-files-found: error
