name: Windows builds

on:
  push:
    branches: [winport]
    tags: ['winport-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cuda:
    uses: ./.github/workflows/windows-cuda.yml

  vulkan:
    uses: ./.github/workflows/windows-vulkan.yml

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/winport-v')
    needs: [cuda, vulkan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release branch
        run: |
          git fetch origin refs/heads/winport:refs/remotes/origin/winport
          git merge-base --is-ancestor HEAD refs/remotes/origin/winport

      - uses: actions/download-artifact@v4
        with:
          name: qwen-hyperdrive-windows-cuda-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: qwen-hyperdrive-windows-vulkan-x64
          path: dist

      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum dist/*.zip | sed 's|  dist/|  |' > dist/SHA256SUMS.txt
          files=(dist/qwen-hyperdrive-windows-cuda-x64.zip
                 dist/qwen-hyperdrive-windows-vulkan-x64.zip
                 dist/SHA256SUMS.txt)
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$state" == false ]]; then
              echo "Release $TAG is already published."
              exit 0
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --draft --prerelease --generate-notes
          fi
          gh release edit "$TAG" --draft=false
